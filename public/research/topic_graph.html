const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));const edges=data.edges.map(e=>({...e,a:byId[e.source],b:byId[e.target]})).filter(e=>e.a&&e.b);
edges.forEach(e=>{e.a.degree++;e.b.degree++});
// Stable columns expose the evaluation structure without inventing causal direction.
const stages={'人类活动':0,'压力扰动':1,'作用机制':2,'敏感性条件':2,'文物对象':2,'损伤影响':3,'遗产属性':3,'评价指标':4,'应对措施':4};
for(let col=0;col<5;col++){const group=nodes.filter(n=>stages[n.types[0]]===col).sort((a,b)=>a.types[0].localeCompare(b.types[0])||b.degree-a.degree);group.forEach((n,i)=>{n.x=100+col*200;n.y=50+i*(560/Math.max(1,group.length-1));n.homeX=n.x;n.homeY=n.y})}
const topLabels=new Set([...nodes].sort((a,b)=>b.degree-a.degree).slice(0,100).map(n=>n.id));
edges.forEach(e=>{e.line=se('line',{'class':'edge','data-association':'undirected'},$('edges'));e.hit=se('line',{'class':'edgehit'},$('edges'));e.hit.addEventListener('click',()=>showEdge(e));e.label=se('text',{'class':'edgelabel','text-anchor':'middle',display:'none'},$('labels'));e.label.textContent=e.relation});
nodes.forEach(n=>{n.g=se('g',{'class':'node','data-id':n.id},$('nodes'));se('circle',{r:(6+Math.min(9,Math.sqrt(n.degree)*1.4))*Math.min(1,Math.sqrt(350/nodes.length)),fill:colors[n.types[0]]||'#789'},n.g);const text=se('text',{x:12,y:4},n.g);text.textContent=n.label.length>15?n.label.slice(0,14)+'…':n.label;n.text=text;text.style.display=topLabels.has(n.id)?'block':'none';const title=se('title',{},n.g);title.textContent=n.label;n.g.addEventListener('click',()=>{if(!dragMoved)select(n.id)});n.g.addEventListener('pointerdown',ev=>startDrag(ev,n))});
function draw(){nodes.forEach(n=>n.g.setAttribute('transform',`translate(${n.x},${n.y})`));edges.forEach(e=>{for(const line of [e.line,e.hit]){line.setAttribute('x1',e.a.x);line.setAttribute('y1',e.a.y);line.setAttribute('x2',e.b.x);line.setAttribute('y2',e.b.y)}e.label.setAttribute('x',(e.a.x+e.b.x)/2);e.label.setAttribute('y',(e.a.y+e.b.y)/2-5)})}draw();
let selected=null;
function highlight(ids){const visible=new Set(ids);const overview=!selected&&nodes.length>400;document.querySelector('#arrow').setAttribute('markerWidth',overview?1.5:5);document.querySelector('#arrow').setAttribute('markerHeight',overview?1.5:5);nodes.forEach(n=>{const circle=n.g.querySelector('circle');circle.style.strokeWidth=overview?'.25':'1.5';circle.setAttribute('r',(6+Math.min(9,Math.sqrt(n.degree)*1.4))*(overview?Math.min(1,Math.sqrt(350/nodes.length)):1))});edges.forEach(e=>{const on=visible.has(e.source)&&visible.has(e.target);e.line.style.strokeWidth=overview?'.3':'1.2';e.line.classList.toggle('dim',!on);e.line.classList.toggle('active',on&&!!selected);e.hit.style.pointerEvents=on?'stroke':'none';e.label.setAttribute('display',on&&selected?'block':'none')});nodes.forEach(n=>{n.g.classList.toggle('dim',!visible.has(n.id));n.g.classList.toggle('active',n.id===selected);n.text.style.display=visible.has(n.id)&&(selected||$('search').value||$('type').value||topLabels.has(n.id))?'block':'none'})}
function card(edge,parent){const c=el('div',`${byId[edge.source].label} — ${byId[edge.target].label} · ${new Set(edge.evidence.map(v=>v.claim_id)).size} 条证据`,parent,'card');c.addEventListener('click',()=>showEdge(edge))}
function select(id){selected=id;const n=byId[id],related=edges.filter(e=>e.source===id||e.target===id);const neighbors=[...new Set(related.flatMap(e=>[e.source,e.target]))].filter(x=>x!==id);n.x=500;n.y=340;n.text.setAttribute('text-anchor','middle');n.text.setAttribute('x',0);n.text.setAttribute('y',-22);neighbors.forEach((key,i)=>{const other=byId[key],left=i%2===0,row=Math.floor(i/2),rows=Math.ceil(neighbors.length/2);other.x=left?220:780;other.y=70+(rows>1?row*530/(rows-1):265);other.text.setAttribute('text-anchor',left?'end':'start');other.text.setAttribute('x',left?-14:14);other.text.setAttribute('y',4)});draw();highlight(new Set([id,...neighbors]));$('detail').replaceChildren();el('h2',n.label,$('detail'));n.types.forEach(t=>el('span',t,$('detail'),'badge'));el('p',`${related.length} 条相邻关系`,$('detail'));related.forEach(e=>card(e,$('detail')));if(!related.length)el('p','本实体没有通过校验的关系。',$('detail'))}
function showEdge(e){selected=e.source;highlight(new Set([e.source,e.target]));$('detail').replaceChildren();el('h2',`${byId[e.source].label} — ${byId[e.target].label}`,$('detail'));e.evidence.forEach(ev=>{el('h3',`${ev.source_name||"来源文献"} · PDF 第 ${ev.page??'未知'} 页`,$('detail'));el('p','原文关系：'+(ev.original_relation||'')+'；主题连线仅为关联',$('detail'));el('div',ev.quote,$('detail'),'quote');el('div',ev.source,$('detail'),'meta');el('p','证据性质：'+(ev.kind||'未分类'),$('detail'));el('p','适用条件：'+((ev.conditions||[]).join('；')||ev.condition||'未明确摘录，请核对原文'),$('detail'));el('p','原始表述：'+(ev.original_source||'')+' → '+(ev.original_target||''),$('detail'))});const b=el('button','查看起点全部关系',$('detail'));b.addEventListener('click',()=>select(e.source))}
function filter(){selected=null;const q=$('search').value.trim().toLowerCase(),t=$('type').value;const matches=nodes.filter(n=>(!q||[n.label,...(n.aliases||[])].some(x=>x.toLowerCase().includes(q)))&&(!t||n.types.includes(t)));const ids=new Set(matches.map(n=>n.id));highlight(ids);if(q||t){$('detail').replaceChildren();el('h2',`找到 ${matches.length} 个实体`,$('detail'));matches.forEach(n=>{const c=el('div',n.label,$('detail'),'card');c.addEventListener('click',()=>select(n.id))})}}
$('search').addEventListener('input',filter);$('type').addEventListener('change',filter);
$('reset').onclick=()=>{$('search').value='';$('type').value='';selected=null;nodes.forEach(n=>{n.x=n.homeX;n.y=n.homeY;n.text.setAttribute('text-anchor','middle');n.text.setAttribute('x',0);n.text.setAttribute('y',-15)});draw();highlight(nodes.map(n=>n.id));$('detail').replaceChildren();el('h2','高连接度实体',$('detail'));[...nodes].sort((a,b)=>b.degree-a.degree).slice(0,12).forEach(n=>{const c=el('div',`${n.label} · ${n.degree} 条关系`,$('detail'),'card');c.onclick=()=>select(n.id)})};
let scale=1,tx=0,ty=0,drag=null,dragMoved=false;const svg=$('graph'),vp=$('viewport');
function transform(){vp.setAttribute('transform',`translate(${tx},${ty}) scale(${scale})`)}
function point(ev){const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}
function startDrag(ev,node){ev.stopPropagation();dragMoved=false;drag={node,p:point(ev)};svg.setPointerCapture(ev.pointerId)}
svg.addEventListener('pointerdown',ev=>{if(ev.target===svg){dragMoved=false;drag={node:null,p:point(ev)};svg.setPointerCapture(ev.pointerId)}});
svg.addEventListener('pointermove',ev=>{if(!drag)return;const p=point(ev),dx=p.x-drag.p.x,dy=p.y-drag.p.y;if(Math.abs(dx)+Math.abs(dy)>1)dragMoved=true;if(drag.node){drag.node.x+=dx/scale;drag.node.y+=dy/scale;draw()}else{tx+=dx;ty+=dy;transform()}drag.p=p});
svg.addEventListener('pointerup',()=>{drag=null;setTimeout(()=>dragMoved=false,30)});svg.addEventListener('pointercancel',()=>drag=null);
svg.addEventListener('wheel',ev=>{ev.preventDefault();const p=point(ev),next=Math.max(.3,Math.min(30,scale*Math.exp(-ev.deltaY*.001)));tx=p.x-(p.x-tx)*next/scale;ty=p.y-(p.y-ty)*next/scale;scale=next;transform()},{passive:false});$('fit').onclick=()=>{scale=1;tx=ty=0;transform()};
$('reset').click();if(!nodes.length){$('detail').replaceChildren();el('h2','暂无通过校验的实体',$('detail'));el('p','请检查 Notebook 的抽取状态与失败片段。',$('detail'))}
</script></body></html>
